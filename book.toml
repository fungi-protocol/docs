[book]
title = "Fungi Protocol Suite"
language = "en"
src = "src"

[build]
create-missing = false

[preprocessor.graphviz]
command = "mdbook-graphviz"
renderers = ["html"]
after = ["links"]

[preprocessor.mermaid]
command = "python3 contrib/mermaid_ssr.py"
after = ["links", "graphviz"]

[preprocessor.pdf]
command = "python3 contrib/pdf_preprocess.py"
renderers = ["pandoc"]
after = ["links", "jupyter"]
before = ["mermaid"]

[preprocessor.katex]
command = "mdbook-katex"
renderers = ["html"]
after = ["links"]

[output.html]
additional-css = ["theme/diagrams.css"]
git-repository-url = "https://github.com/fungi-protocol/docs"
site-url = "/docs/"
