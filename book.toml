[book]
title = "Fungi Protocol Suite"
language = "en"
src = "src"

[build]
create-missing = false

[preprocessor.graphviz]
command = "mdbook-graphviz"
after = ["links"]

[preprocessor.mermaid]
command = "python3 contrib/mermaid_ssr.py"
after = ["links", "graphviz"]

[preprocessor.katex]
command = "mdbook-katex"
after = ["links"]

# Reads the chapters' source, before the other preprocessors render it.
[preprocessor.narration]
command = "python3 contrib/narration.py"
after = ["links"]
before = ["graphviz", "mermaid", "katex"]

[output.html]
additional-css = ["theme/diagrams.css", "theme/narration.css"]
additional-js = ["theme/narration.js"]
git-repository-url = "https://github.com/fungi-protocol/docs"
site-url = "/docs/"
