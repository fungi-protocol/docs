[book]
title = "Fungi Protocol Suite"
language = "en"
src = "src"

[build]
create-missing = false

# Links out of the book name a revision; nix/site.nix sets the one it builds.
[preprocessor.relink]
command = "relink"
after = ["links"]
before = ["graphviz", "katex", "mermaid"]
blob = "https://github.com/fungi-protocol/docs/blob/main"

[preprocessor.graphviz]
command = "mdbook-graphviz"
after = ["links"]

[preprocessor.mermaid]
command = "python3 contrib/mermaid_ssr.py"
after = ["links", "graphviz"]

[preprocessor.katex]
command = "mdbook-katex"
after = ["links"]

[output.html]
additional-css = ["theme/diagrams.css"]
git-repository-url = "https://github.com/fungi-protocol/docs"
